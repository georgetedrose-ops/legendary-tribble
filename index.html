<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1b2330" />
<title>Hex Village</title>
<style>
  :root {
    --bg: #141a24;
    --panel: #1d2733;
    --panel2: #243140;
    --ink: #e8eef5;
    --muted: #9fb0c2;
    --line: #32445a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #stats {
    display: flex; gap: 4px; padding: 6px 8px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    overflow-x: auto; flex: 0 0 auto;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center;
    min-width: 52px; padding: 2px 6px; border-radius: 8px;
    background: var(--panel2);
  }
  .stat .ic { font-size: 15px; line-height: 1; }
  .stat .val { font-size: 14px; font-weight: 700; margin-top: 1px; }
  .stat .lb { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #toast {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: rgba(20,26,36,.92); border: 1px solid var(--line);
    color: var(--ink); padding: 8px 14px; border-radius: 10px;
    font-size: 13px; max-width: 90%; text-align: center;
    opacity: 0; transition: opacity .3s; pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; }

  #panel {
    flex: 0 0 auto; background: var(--panel);
    border-top: 1px solid var(--line); padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #sel { font-size: 13px; color: var(--muted); min-height: 18px; line-height: 1.3; }
  #sel b { color: var(--ink); }
  #actions { display: flex; gap: 6px; flex-wrap: wrap; }
  button.act {
    flex: 1 1 auto; min-width: 70px; padding: 11px 8px;
    background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-weight: 600;
  }
  button.act:active { background: #2e4257; }
  button.act:disabled { opacity: .35; }
  button.act.up { border-color: #3a6f4c; }
  button.act.down { border-color: #6f4a3a; }
  button.act.go { background: #2c6e44; border-color: #3a8a57; }
  #log {
    height: 46px; overflow-y: auto; font-size: 11px; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 6px; line-height: 1.4;
  }
  #log div { margin: 1px 0; }
  #hint { font-size: 11px; color: var(--muted); text-align: center; }

  /* ---- pixel event modal ---- */
  #event {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,11,16,.74);
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  #event.hidden { display: none; }
  .ebox {
    background: #0e141d; max-width: 350px; width: 100%; padding: 16px;
    border: 3px solid #cdd6e0;
    box-shadow: 0 0 0 3px #0e141d, 0 0 0 6px #59708a, 6px 6px 0 6px rgba(0,0,0,.5);
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-font-smoothing: none; font-smooth: never; image-rendering: pixelated;
  }
  .etitle {
    color: #ffe066; font-size: 14px; font-weight: 700; margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000;
  }
  .etext {
    color: #bfe7c4; font-size: 13px; line-height: 1.55; min-height: 66px;
    white-space: pre-wrap; text-shadow: 1px 1px 0 #000;
  }
  .etext .caret { color:#bfe7c4; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .eopts { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
  .eopt {
    width: 100%; text-align: left; padding: 10px 12px;
    background: #182334; color: #e8eef5; font-family: inherit; font-size: 13px;
    border: 2px solid #59708a; box-shadow: 3px 3px 0 #000; cursor: pointer;
    text-shadow: 1px 1px 0 #000;
  }
  .eopt:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  .eopt:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="app">
  <div id="stats"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div id="sel">Tap a hex to inspect. Tap a forest, quarry, cow or marauder to put a villager to work.</div>
    <div id="actions"></div>
    <div id="log"></div>
    <div id="hint">Tap a hex + swipe up = raise · swipe down = lower. Or use the buttons.</div>
  </div>
  <div id="event" class="hidden">
    <div class="ebox" id="ebox">
      <div class="etitle" id="etitle"></div>
      <div class="etext" id="etext"></div>
      <div class="eopts" id="eopts"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   HEX VILLAGE — a lightweight terraforming village sim
   Single terrain (grass). Elevation -2..+3 drives everything;
   lighting/shadow (not colour) conveys height.
     +3 mountain (impassable)   +2 big hill   +1 small hill
      0 flat grass
     -1 dip  (or shallow water if touching the sea — crossable)
     -2 quarry (or deep water if touching the sea — impassable)
   ============================================================ */

// ---------- hex math (pointy-top, axial q,r) ----------
const SQ3 = Math.sqrt(3);
let HEX = 26;                // hex radius in px (recomputed to fit)
const ELEV = 11;             // px lift per raised level (hills/mountains)
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const key = (q,r)=>q+","+r;

function hexToPixel(q,r){ return { x: HEX*SQ3*(q + r/2), y: HEX*1.5*r }; }
// HEX-independent "unit" coordinates for continuous entity positions (scaled by HEX at draw time)
function uPix(q,r){ return { x: SQ3*(q + r/2), y: 1.5*r }; }
function uToHex(x,y){ return cubeRound((SQ3/3*x - 1/3*y), (2/3*y)); }
function pixelToHex(px,py){
  const q = (SQ3/3*px - 1/3*py)/HEX;
  const r = (2/3*py)/HEX;
  return cubeRound(q,r);
}
function cubeRound(q,r){
  let x=q, z=r, y=-x-z;
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if (dx>dy && dx>dz) rx=-ry-rz; else if (dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return { q: rx, r: rz };
}
function hexDist(a,b){
  return (Math.abs(a.q-b.q) + Math.abs(a.q+a.r-b.q-b.r) + Math.abs(a.r-b.r))/2;
}

// ---------- materials (grass is the only terrain; rest is water/rock) ----------
const GRASS   = [95,166,74];
const W_DEEP  = [20,72,110];
const W_SHALL = [46,128,176];
const ROCK    = [128,122,114];
const MOUNT   = [150,150,156];

// elevation limits
const E_MIN = -2, E_MAX = 3;

// ---------- terrain classification (depends on water flood) ----------
function isWalkable(t){ return !!t && (t.bridge || (t.elev >= -1 && t.elev <= 2)); } // -2 & +3 blocked unless bridged
// movement cost: flat ground is fastest, each step up/down is slower (until impassable)
function moveCost(t){ return t.bridge ? 1 : 1 + Math.abs(t.elev); }   // bridges cross at full speed
function speedWord(t){ const c=moveCost(t); return c===1?"normal speed":c===2?"slow":"very slow"; }
function deepWater(t){ return t.wet && t.elev <= -2; }
function shallowWater(t){ return t.wet && t.elev === -1; }
function quarry(t){ return !t.wet && t.elev <= -2; }
function mountain(t){ return t.elev >= 3; }
function tileName(t){
  if (deepWater(t)) return "deep water";
  if (shallowWater(t)) return "shallow water";
  if (quarry(t)) return "quarry";
  if (mountain(t)) return "mountain";
  if (t.elev === -1) return "dip";
  if (t.elev === 1) return "small hill";
  if (t.elev === 2) return "big hill";
  return "flat grassland";
}

// ---------- game state ----------
const START_RES = { food:12, milk:0, wood:8, stone:3, gold:6, leather:0, tools:0 };
const G = {
  map: new Map(),
  ents: [],
  res: { ...START_RES },
  pop: 0,
  day: 0, tick: 0,
  selHex: null,
  placing: null,     // 'watchtower' while siting a building
  paused: false,     // true while an event modal is open
  alarm: false,      // bell raised -> villagers muster at the warehouse
  shots: [],         // transient watchtower arrow effects
  nextEvent: 60, lastBadTick: -999,
  over: false,
};
let nextId = 1;
const eid = ()=>"e"+(nextId++);
const RADIUS = 5;
const rnd = (n)=>Math.floor(Math.random()*n);
const pick = (a)=>a[rnd(a.length)];

// ---------- water flood: sea spreads inland through low ground ----------
function isSource(t){ return t.isSea && t.elev <= -2; }
function computeWater(){
  for (const t of G.map.values()) t.wet = false;
  const stack = [];
  for (const t of G.map.values()) if (isSource(t)){ t.wet = true; stack.push(t); }
  while (stack.length){
    const t = stack.pop();
    for (const [dq,dr] of DIRS){
      const n = G.map.get(key(t.q+dq, t.r+dr));
      if (!n || n.wet) continue;
      if (n.elev <= -1 || isSource(n)){ n.wet = true; stack.push(n); }
    }
  }
}

// ---------- procedural map generation ----------
// elevation = sum of random peaks/basins (forms ranges & valleys) minus a
// random coastline gradient (sea on one side); then a river is carved down
// from the heights to the sea. Every new game is different.
const fpx = t => t.q + t.r/2, fpy = t => t.r*0.8660254;
function nearestSeaTile(from){
  let best=null, bd=1e9;
  for (const t of G.map.values()){ if(!t.isSea) continue; const d=hexDist(t,from); if(d<bd){ bd=d; best=t; } }
  return best;
}
function carveRiver(cells){
  const highs = cells.filter(t=>t.elev>=2 && !t.isSea);
  if (!highs.length) return;
  let cur = pick(highs); const visited=new Set(); const path=[];
  for (let s=0; s<RADIUS*5; s++){
    const k=key(cur.q,cur.r); if (visited.has(k)) break; visited.add(k); path.push(cur);
    if (cur.isSea) break;
    const nbrs = DIRS.map(([dq,dr])=>G.map.get(key(cur.q+dq,cur.r+dr))).filter(n=>n && !visited.has(key(n.q,n.r)));
    if (!nbrs.length) break;
    nbrs.sort((a,b)=>a._e-b._e);                 // flow downhill, sometimes meander
    cur = (nbrs.length>1 && Math.random()<0.3) ? nbrs[1] : nbrs[0];
  }
  for (const t of path){ if(!t.isSea) t.elev = -2; }    // a deep, 1-wide river (needs a bridge)
  // make sure it actually reaches the sea so the channel floods
  const adjSea = t => DIRS.some(([dq,dr])=>{ const n=G.map.get(key(t.q+dq,t.r+dr)); return n && n.isSea; });
  let last = path[path.length-1], guard=0;
  while (last && !last.isSea && !adjSea(last) && guard++<RADIUS*5){
    const sea = nearestSeaTile(last); if(!sea) break;
    const nbrs = DIRS.map(([dq,dr])=>G.map.get(key(last.q+dq,last.r+dr))).filter(Boolean);
    if (!nbrs.length) break;
    nbrs.sort((a,b)=>hexDist(a,sea)-hexDist(b,sea));
    const nx = nbrs[0]; if(!nx) break;
    if (!nx.isSea) nx.elev = -2;
    last = nx;
  }
}
function genMap(){
  G.map.clear();
  const cells=[];
  for (let q=-RADIUS; q<=RADIUS; q++) for (let r=-RADIUS; r<=RADIUS; r++){
    if (Math.abs(q+r) > RADIUS) continue;
    const t = { q, r, elev:0, improve:null, isSea:false, wet:false, bridge:false };
    G.map.set(key(q,r), t); cells.push(t);
  }
  // random elevation features: peaks (ranges) and basins (valleys)
  const feats=[];
  for (let i=0, n=2+rnd(2); i<n; i++)
    feats.push({ x:(Math.random()*2-1)*RADIUS*0.8, y:(Math.random()*2-1)*RADIUS*0.8, h:1.8+Math.random()*2.4, rad:1.4+Math.random()*1.7 });
  for (let i=0, n=1+rnd(2); i<n; i++)
    feats.push({ x:(Math.random()*2-1)*RADIUS*0.8, y:(Math.random()*2-1)*RADIUS*0.8, h:-(1.5+Math.random()*1.6), rad:1.4+Math.random()*1.5 });
  // coastline: sink one random side into the sea
  const ang=Math.random()*Math.PI*2, cd0=Math.cos(ang), cd1=Math.sin(ang);
  let minP=1e9, maxP=-1e9;
  for (const t of cells){ t._p=fpx(t)*cd0+fpy(t)*cd1; if(t._p<minP)minP=t._p; if(t._p>maxP)maxP=t._p; }
  for (const t of cells){
    let e=0.7;
    for (const f of feats){ const dx=fpx(t)-f.x, dy=fpy(t)-f.y; e += f.h*Math.exp(-(dx*dx+dy*dy)/(2*f.rad*f.rad)); }
    const pn=(t._p-minP)/((maxP-minP)||1);
    e -= pn*pn*4.4;                       // far coast side drops into the sea
    e += (Math.random()-0.5)*0.6;         // roughness
    t._e=e;
  }
  for (const t of cells) t.elev = Math.max(E_MIN, Math.min(E_MAX, Math.round(t._e)));
  // ocean: flood inward from the low coastal border
  const border = cells.filter(t=>hexDist(t,{q:0,r:0})===RADIUS);
  let seeds = border.filter(t=>t.elev<=-1);
  if (!seeds.length){ border.sort((a,b)=>a._e-b._e); border[0].elev=-2; seeds=[border[0]]; }
  const ocean=new Set(), stack=[...seeds];
  while (stack.length){
    const t=stack.pop(), k=key(t.q,t.r); if (ocean.has(k)) continue; ocean.add(k);
    for (const [dq,dr] of DIRS){ const n=G.map.get(key(t.q+dq,t.r+dr)); if(n && !ocean.has(key(n.q,n.r)) && n.elev<=-1) stack.push(n); }
  }
  for (const k of ocean){ const t=G.map.get(k); if (t.elev<=-2 || hexDist(t,{q:0,r:0})===RADIUS){ t.elev=-2; t.isSea=true; } }
  if (![...ocean].some(k=>G.map.get(k).isSea)){ const t=G.map.get([...ocean][0]); if(t){ t.elev=-2; t.isSea=true; } }
  // carve 1-2 rivers from the heights to the sea
  for (let i=0, n=1+rnd(2); i<n; i++) carveRiver(cells);
  computeWater();
  // forests clustered on low land
  const land = cells.filter(t=>t.elev>=0 && t.elev<=1 && !t.isSea);
  for (let c=0, n=3+rnd(3); c<n && land.length; c++){
    const ctr=pick(land);
    for (const t of [ctr, ...DIRS.map(([dq,dr])=>G.map.get(key(ctr.q+dq,ctr.r+dr)))]){
      if (t && t.elev>=0 && t.elev<=1 && !t.improve && !t.isSea && Math.random()<0.55)
        t.improve={kind:"forest", wood:4+rnd(4)};
    }
  }
}

// ---------- entities ----------
function addEnt(e){ e.id = eid(); if(e.x===undefined){ const p=uPix(e.q,e.r); e.x=p.x; e.y=p.y; } G.ents.push(e); return e; }
function entAt(q,r,type){ return G.ents.find(e=>e.q===q&&e.r===r&&(!type||e.type===type)); }
function removeEnt(id){ const i=G.ents.findIndex(e=>e.id===id); if(i>=0) G.ents.splice(i,1); }

function setupStart(){
  genMap();
  G.ents.length = 0;
  G.over=false; G.alarm=false; G.placing=null; G.paused=false; G.shots=[]; G.lastBadTick=-999;
  let home = null;
  for (let d=0; d<=RADIUS && !home; d++){
    for (const t of G.map.values()){
      if (hexDist(t,{q:0,r:0})===d && t.elev===0 && !t.improve){ home=t; break; }
    }
  }
  if (!home){ home = G.map.get(key(0,0)); home.elev = 0; home.isSea=false; computeWater(); }
  addEnt({ type:"warehouse", q:home.q, r:home.r, hp:14, maxhp:14 });   // central HQ — all resources deposit here
  placeHouse(home); placeHouse(home);                 // a home for each starting villager
  spawnVillager(home.q, home.r);
  spawnVillager(home.q, home.r);
  G.pop = 2;
  log("Your village begins. Each villager has a home; tap a home to find its owner.");
}

// find a free walkable tile near `near` that has no building/improvement on it
function freeTileNear(near, avoidType){
  for (let d=1; d<=RADIUS; d++){
    const ring = [...G.map.values()].filter(t=>hexDist(t,near)===d && isWalkable(t) && !t.improve
      && !G.ents.some(e=>e.q===t.q&&e.r===t.r&&(e.type==="warehouse"||e.type==="house"||e.type==="watchtower")));
    if (ring.length) return pick(ring);
  }
  return null;
}
function placeHouse(near){
  const t = freeTileNear(near||warehouse()||{q:0,r:0});
  if (!t) return null;
  return addEnt({ type:"house", q:t.q, r:t.r, homeOf:null, hp:4, maxhp:4 });
}
const houseCount = ()=>G.ents.filter(e=>e.type==="house").length;
const freeHouse  = ()=>G.ents.find(e=>e.type==="house" && !e.homeOf);

function spawnVillager(q,r){
  let spot = {q,r};
  for (const [dq,dr] of DIRS){
    const t = G.map.get(key(q+dq,r+dr));
    if (t && isWalkable(t) && !entAt(t.q,t.r,"villager")){ spot={q:t.q,r:t.r}; break; }
  }
  const v = addEnt({ type:"villager", q:spot.q, r:spot.r, task:null, work:0, homeId:null, hp:3, maxhp:3, baseSpeed:1.7 });
  const h = freeHouse();
  if (h){ h.homeOf = v.id; v.homeId = h.id; }
  return v;
}

// ---------- pathfinding: least-cost (Dijkstra over move costs) ----------
// Returns the full QUICKEST (lowest travel-time) path as an array of cells
// (from the next step to the goal), honouring per-tile move cost so routes
// prefer flat ground and avoid slow hills / impassable rivers.
// goalAdjacentOk = stop on any tile next to the goal.
function findPath(from, goal, goalAdjacentOk){
  if (from.q===goal.q && from.r===goal.r) return [];
  const start = key(from.q,from.r);
  const dist = new Map([[start,0]]);
  const prev = new Map([[start,null]]);
  const pq = [{k:start, q:from.q, r:from.r, d:0}];
  let reached = null;
  while (pq.length){
    let bi=0; for (let i=1;i<pq.length;i++) if (pq[i].d<pq[bi].d) bi=i;  // small grid: linear pop
    const cur = pq.splice(bi,1)[0];
    if (cur.d > (dist.get(cur.k) ?? Infinity)) continue;
    if (cur.q===goal.q && cur.r===goal.r){ reached=cur.k; break; }
    if (goalAdjacentOk && hexDist(cur,goal)===1){ reached=cur.k; break; }
    for (const [dq,dr] of DIRS){
      const nq=cur.q+dq, nr=cur.r+dr, k=key(nq,nr);
      const t = G.map.get(k); if (!t) continue;
      const isGoal = (nq===goal.q && nr===goal.r);
      if (!isWalkable(t) && !(isGoal && !goalAdjacentOk)) continue;
      const nd = cur.d + moveCost(t);
      if (nd < (dist.get(k) ?? Infinity)){
        dist.set(k,nd); prev.set(k,cur.k);
        pq.push({k, q:nq, r:nr, d:nd});
      }
    }
  }
  if (!reached) return null;
  const cells = []; let k = reached;
  while (k && k !== start){ const [q,r]=k.split(",").map(Number); cells.unshift({q,r}); k = prev.get(k); }
  return cells;
}

function atGoal(e, goal, adj){
  if (e.q===goal.q && e.r===goal.r) return true;
  return adj && hexDist(e,goal)===1;
}
// Request continuous movement toward a goal and report progress. The actual
// gliding happens every frame in moveEntities(); here we just (re)plan the path
// and check arrival. Returns true = arrived, false = travelling, null = no path.
function stepToward(ent, goal, adjacentOk, mul){
  if (atGoal(ent, goal, adjacentOk)){ ent.goal=null; ent.path=null; return true; }
  const path = findPath({q:ent.q,r:ent.r}, goal, adjacentOk);
  if (!path || !path.length){ ent.goal=null; ent.path=null; return null; }
  ent.path = path;
  ent.goal = { q:goal.q, r:goal.r, adj:!!adjacentOk, mul:mul||1 };
  return false;
}
// real-time movement: glide each entity along its path by speed*dt every frame
function moveEntities(dt){
  for (const e of G.ents){
    if (!e.goal || !e.path || !e.path.length) continue;
    let remaining = dt;
    while (remaining>0 && e.path.length){
      const wp = e.path[0], w = uPix(wp.q,wp.r);
      const dx = w.x-e.x, dy = w.y-e.y, d = Math.hypot(dx,dy);
      if (d < 1e-6){ e.path.shift(); continue; }
      const tile = G.map.get(key(wp.q,wp.r));
      const sp = (e.baseSpeed||1) * (e.goal.mul||1) / (tile?moveCost(tile):1) * SQ3; // units/sec
      const travel = sp*remaining;
      if (travel >= d){ e.x=w.x; e.y=w.y; e.path.shift(); remaining -= d/sp; }
      else { e.x += dx/d*travel; e.y += dy/d*travel; remaining = 0; }
    }
    const h = uToHex(e.x, e.y); e.q=h.q; e.r=h.r;
    if (!e.path.length) e.goal=null;            // arrived at the end of the path
  }
}
function warehouse(){ return G.ents.find(e=>e.type==="warehouse"); }
// a deep-water tile is bridgeable only where it's a narrow crossing
// (walkable land/bridge on two opposite sides) — i.e. a 1-wide river/strait
function bridgeable(t){
  if (!t || !t.wet || t.elev>-2 || t.bridge) return false;
  const nb = DIRS.map(([dq,dr])=>G.map.get(key(t.q+dq,t.r+dr)));
  for (let i=0;i<3;i++) if (isWalkable(nb[i]) && isWalkable(nb[i+3])) return true;
  return false;
}
// is the warehouse linked by land/bridge to the outside world? if not, no trade
function villageConnected(){
  const wh = warehouse(); if (!wh) return false;
  const seen=new Set([key(wh.q,wh.r)]); const q=[wh];
  while (q.length){
    const t=q.shift();
    if (hexDist(t,{q:0,r:0})===RADIUS) return true;       // reached the map edge
    for (const [dq,dr] of DIRS){
      const n=G.map.get(key(t.q+dq,t.r+dr)); if(!n) continue;
      const k=key(n.q,n.r); if (seen.has(k) || !isWalkable(n)) continue;
      seen.add(k); q.push(n);
    }
  }
  return false;
}
function nearestHouse(from){
  let best=null, bd=1e9;
  for (const e of G.ents){
    if (e.type!=="house") continue;
    const d = hexDist(e,from);
    if (d<bd){ bd=d; best=e; }
  }
  return best;
}
// all resources are deposited at the warehouse (HQ); fall back to a house
function depotFor(from){ return warehouse() || nearestHouse(from); }

// ---------- villager command ----------
function nearestIdleVillager(q,r){
  let best=null, bd=1e9;
  for (const e of G.ents){
    // idle, or just mustering at the alarm (so defenders can still be sent out)
    if (e.type!=="villager" || (e.task && e.task.kind!=="muster")) continue;
    const d = hexDist(e,{q,r});
    if (d<bd){ bd=d; best=e; }
  }
  return best;
}
// gather jobs haul a resource home; instant jobs act in place
const GATHER = {
  chop: { res:"wood",  amt:2, work:3, stock:"wood",  verb:"chopping" },
  mine: { res:"stone", amt:2, work:4, stock:"stone", verb:"mining" },
  farm: { res:"food",  amt:2, work:3, stock:null,    verb:"farming" },
  tend: { res:"milk",  amt:2, work:2, stock:null,    verb:"tending", bonus:"leather" }, // cows: milk + occasional leather
};
function assignTask(kind, target){
  const v = nearestIdleVillager(target.q, target.r);
  if (!v){ flash("All villagers are busy — recall one first."); return false; }
  if (v.carry) dropCarry(v, false);          // drop any held load on the ground
  v.task = { kind, q:target.q, r:target.r, targetId: target.id || null, phase:"go" };
  v.work = 0; v.stationed = false; v.suspended = null; v.dropId = null;
  return true;
}
function assignNearest(kind, target){
  if (assignTask(kind, target)) flash("Villager dispatched.");
}

// ---------- terraform ----------
function terraform(q,r,dir){
  const t = G.map.get(key(q,r));
  if (!t) return;
  if (dir>0 && t.elev>=E_MAX){ flash("Already a mountain peak."); return; }
  if (dir<0 && t.elev<=E_MIN){ flash(deepWater(t)?"Already deep water.":"Already a quarry."); return; }
  if (assignTask(dir>0?"raise":"lower", {q,r})){
    flash((dir>0?"Raising":"Lowering")+" the "+tileName(t)+"…");
  }
}

// ---------- event spawn helpers ----------
function spawnEdgeHex(walkableOnly){
  const edge = [];
  for (const t of G.map.values()){
    if (hexDist(t,{q:0,r:0})>=RADIUS-1 && (!walkableOnly || isWalkable(t))) edge.push(t);
  }
  return edge.length ? pick(edge) : null;
}
function spawnCows(n){ for(let i=0;i<n;i++){ const t=spawnEdgeHex(true); if(t) addEnt({type:"cow", q:t.q, r:t.r, timer:45+rnd(30), baseSpeed:0.6}); } }
function spawnTrader(){
  if (!villageConnected()) return false;             // cut-off villages get no traders
  const t=spawnEdgeHex(true); if(!t) return false;
  addEnt({type:"trader", q:t.q, r:t.r, timer:38+rnd(20), stock:{res:"tools", amt:2+rnd(3)}});
  return true;
}
function spawnMarauders(n){ for(let i=0;i<n;i++){ const t=spawnEdgeHex(true); if(t){ const hp=2+rnd(2), thief=Math.random()<0.4; addEnt({type:"marauder", q:t.q, r:t.r, hp, maxhp:hp, acd:0, spawn:{q:t.q,r:t.r}, thief, loot:null, baseSpeed: thief?1.8:1.0}); } } }
function loseVillager(reason){
  const vs = G.ents.filter(e=>e.type==="villager");
  if (vs.length<=1){ return false; }
  removeVillager(pick(vs));
  if (reason) log(reason);
  return true;
}
// remove a villager, free its home, end the game if it was the last one
function removeVillager(v){
  if (v.homeId){ const h=G.ents.find(e=>e.id===v.homeId); if(h) h.homeOf=null; }
  removeEnt(v.id); G.pop--;
  if (G.pop<=0){ G.over=true; flash("Your last villager is gone — game over."); }
}
function fireEvent(){
  // a cut-off village gets no trader/merchant events; raids are spaced out
  const usable = e => !e.trade || villageConnected();
  const bad = EVENTS.filter(e=>e.bad && usable(e)), good = EVENTS.filter(e=>!e.bad && usable(e));
  let pool = good;
  if (G.tick - (G.lastBadTick||-999) > 70 && Math.random()<0.5 && bad.length) pool = bad;
  if (!pool.length) pool = good.length ? good : EVENTS.filter(usable);
  const ev = pick(pool);
  if (ev.bad) G.lastBadTick = G.tick;
  openEvent(ev);
}

// ---------- main logic tick ----------
function logicTick(){
  if (G.over || G.paused) return;       // events pause the world
  G.tick++;
  const hq = warehouse() || G.ents.find(e=>e.type==="house");   // raid/spawn anchor

  if (--G.nextEvent <= 0){ fireEvent(); G.nextEvent = 75 + rnd(55); }   // ~50-90s between events

  for (const v of G.ents){
    if (v.type!=="villager") continue;
    if (!v.task){ v.goal=null; v.path=null; continue; }   // idle villagers stand still
    if (v.task.kind==="muster") handleMuster(v);
    else if (v.task.kind==="recover") handleRecover(v);
    else if (v.task.kind==="buildtower" || v.task.kind==="man") handleTower(v);
    else if (GATHER[v.task.kind]) handleGather(v);
    else handleInstant(v);
  }

  for (const e of [...G.ents]){
    if (e.type==="cow"){
      if (--e.timer<=0){ removeEnt(e.id); log("🐄 The cows wandered off."); continue; }
      // cows wander the map unless a villager is actively tending them
      const tended = G.ents.some(x=>x.type==="villager"&&x.task&&x.task.kind==="tend"
                                   &&x.task.targetId===e.id&&x.task.phase!=="home");
      if (tended){ e.goal=null; e.path=null; }
      else {
        e.wcd = (e.wcd||0) - 1;
        if (e.wcd<=0 && !e.goal){
          e.wcd = 6 + rnd(6);
          const opts = DIRS.map(([dq,dr])=>G.map.get(key(e.q+dq,e.r+dr))).filter(t=>t && isWalkable(t));
          if (opts.length){ const t=pick(opts); stepToward(e, {q:t.q,r:t.r}, false, 1); }
        }
      }
    } else if (e.type==="trader"){
      if (--e.timer<=0){ removeEnt(e.id); log("🛒 The traders moved on."); }
    } else if (e.type==="marauder"){
      marauderAct(e);
      if (G.over) break;
    }
  }

  // watchtowers: a manned, built tower fires arrows at the nearest marauder in range
  for (const tw of G.ents){
    if (tw.type!=="watchtower" || !tw.built) continue;
    const crew = tw.crew && G.ents.find(e=>e.id===tw.crew);
    if (!crew || !crew.task || crew.task.kind!=="man" || !crew.stationed){ tw.crew=null; continue; }
    if ((tw.cd=(tw.cd||0)-1) > 0) continue;
    let tgt=null, bd=1e9;
    for (const m of G.ents){ if (m.type!=="marauder") continue; const d=hexDist(m,tw); if (d<=tw.range && d<bd){ bd=d; tgt=m; } }
    if (tgt){
      tgt.hp--; tw.cd=2;
      G.shots.push({ a:{q:tw.q,r:tw.r}, b:{q:tgt.q,r:tgt.r}, life:8 });
      if (tgt.hp<=0){ dropLoot(tgt); removeEnt(tgt.id); G.res.gold+=2; log("🏹 The watchtower felled a marauder! +2 gold."); }
    }
  }

  // upkeep: villagers eat the food they've stored
  let food = G.res.food - G.pop * 0.05;
  if (food < 0){
    food = 0;
    if (Math.random()<0.15) loseVillager("☠️ A villager starved. Assign a farmer!");
  }
  G.res.food = food;

  // wounded villagers recover slowly when not out working
  if (G.tick % 5 === 0){
    const danger = e => G.ents.some(m=>m.type==="marauder" && hexDist(m,e)<=1);
    for (const v of G.ents){
      if (v.type==="villager" && v.hp<v.maxhp && (!v.task || v.task.kind==="muster") && !danger(v)) v.hp++;
    }
  }

  if (G.res.food >= 12 && G.pop < houseCount() && freeHouse()){
    G.res.food -= 10; G.pop++;
    if (hq){ spawnVillager(hq.q, hq.r); log("👶 A new villager moves into a free house!"); flash("A new villager is born!"); }
  }

  if (G.tick % 10 === 0){ G.day++; saveGame(); }
  if (G.pop<=0){ G.over=true; log("Your village has fallen. Tap Restart."); flash("Game over — your village is empty."); saveGame(); }

  renderStats();
  refreshPanel();
}

// gather loop: travel to work site -> gather -> carry home -> deposit -> repeat
function handleGather(v){
  const job = v.task, spec = GATHER[job.kind];
  // resolve a live site (cows move; tile sites are fixed)
  let sq=job.q, sr=job.r;
  if (job.targetId){
    const te = G.ents.find(e=>e.id===job.targetId);
    if (!te){ v.task=null; v.carry=null; return; }       // cow gone
    sq=te.q; sr=te.r;
  }
  const site = G.map.get(key(sq,sr));

  if (job.phase==="go"){
    const onTile = isWalkable(site) && job.kind!=="mine"; // quarry mined from adjacent
    const arr = stepToward(v, {q:sq,r:sr}, !onTile, 1);
    if (arr===null){ v.task=null; flash("A villager can't reach that work site."); return; }
    if (arr){ job.phase="work"; v.work=0; }
    return;
  }
  if (job.phase==="work"){
    if (job.kind==="farm" && !site.improve) site.improve={kind:"farm"};
    v.work++;
    if (v.work>=spec.work){
      let amt = spec.amt;
      if (spec.stock && site.improve){
        amt = Math.min(amt, site.improve[spec.stock]||0);
        site.improve[spec.stock] -= amt;
        if ((site.improve[spec.stock]||0) <= 0){ site.improve=null; job.done=true; }
      }
      v.carry = { res:spec.res, amt };
      job.phase="home";
    }
    return;
  }
  if (job.phase==="home"){
    const depot = depotFor(v);
    if (!depot){ v.task=null; return; }
    const arr = stepToward(v, {q:depot.q,r:depot.r}, true, 1);
    if (arr===null){ v.task=null; flash("A villager is stranded from the warehouse."); return; }
    if (arr){
      if (v.carry){
        G.res[v.carry.res] += v.carry.amt;
        let msg = "📦 Deposited "+v.carry.amt+" "+v.carry.res;
        if (spec.bonus && Math.random()<0.4){ G.res[spec.bonus]++; msg += " (+1 "+spec.bonus+")"; }
        log(msg+" at the warehouse."); v.carry=null;
      }
      if (job.done){ v.task=null; return; }               // site exhausted
      job.phase="go"; v.work=0;                            // loop for another load
    }
  }
}

// watchtower jobs: build it, then man it (the crew stays stationed and fires)
function handleTower(v){
  const tk = v.task;
  const tw = G.ents.find(e=>e.id===tk.targetId);
  if (!tw || tw.type!=="watchtower"){ v.task=null; v.stationed=false; return; }
  const arr = stepToward(v, {q:tw.q,r:tw.r}, true, 1);
  if (arr===null){ v.task=null; flash("A villager can't reach the tower."); return; }
  if (!arr){ v.stationed=false; return; }
  if (tk.kind==="buildtower"){
    if (!tw.built){
      v.work++;
      if (v.work>=5){ tw.built=true; v.task=null; log("🗼 The watchtower is built — assign a villager to man it."); flash("Watchtower complete!"); }
    } else v.task=null;
  } else { // man: stay on post
    if (!tw.built){ v.task=null; flash("The tower isn't built yet."); return; }
    tw.crew = v.id; v.stationed = true;
  }
}

// ---------- the alarm bell (toggle) ----------
// drop a carried load on the ground; ownerRef lets the dropper remember it
function dropCarry(v, ownerRef){
  if (!v.carry) return null;
  const it = addEnt({ type:"item", res:v.carry.res, amt:v.carry.amt, q:v.q, r:v.r });
  if (ownerRef) v.dropId = it.id;
  v.carry = null;
  return it;
}
function setAlarm(on){
  const wh = warehouse(); if (!wh) return;
  if (on === G.alarm) return;
  G.alarm = on;
  if (on){
    flash("🔔 Alarm! Villagers drop their loads and muster.");
    log("🔔 The alarm bell rings — villagers rush home, dropping what they carry.");
    for (const v of G.ents){
      if (v.type!=="villager") continue;
      if (v.carry) dropCarry(v, true);
      if (v.task && v.task.kind!=="muster") v.suspended = v.task;   // remember the job
      v.task = { kind:"muster" }; v.work=0; v.stationed=false;
    }
  } else {
    flash("✅ All clear — villagers return to work.");
    log("✅ The all-clear sounds — villagers resume their work and fetch dropped loads.");
    for (const v of G.ents){
      if (v.type==="villager" && v.task && v.task.kind==="muster") resumeVillager(v);
    }
  }
  refreshPanel();
}
function resumeVillager(v){
  if (v.dropId && G.ents.some(e=>e.id===v.dropId)){ v.task={kind:"recover", targetId:v.dropId}; v.work=0; return; }
  v.dropId = null;
  if (v.suspended){ const s=v.suspended; v.suspended=null; if (s.phase) s.phase="go"; v.task=s; v.work=0; return; }
  v.task = null;
}
function ringBell(){ setAlarm(true); }
function toggleAlarm(){ setAlarm(!G.alarm); }

// while the alarm sounds, hold position by the warehouse
function handleMuster(v){
  const wh = warehouse() || depotFor(v);
  if (!wh){ v.task=null; return; }
  stepToward(v, {q:wh.q,r:wh.r}, true, 1);
}
// fetch a previously dropped load, carry it home, then resume the old job
function handleRecover(v){
  if (!v.carry){
    const item = G.ents.find(e=>e.id===v.task.targetId);
    if (!item){ v.dropId=null; finishRecover(v); return; }   // it was stolen/gone
    const arr = stepToward(v, {q:item.q,r:item.r}, false, 1);
    if (arr===null){ v.dropId=null; finishRecover(v); return; }
    if (arr){ v.carry={res:item.res, amt:item.amt}; removeEnt(item.id); v.dropId=null; }
    return;
  }
  const depot = depotFor(v);
  const arr = stepToward(v, {q:depot.q,r:depot.r}, true, 1);
  if (arr===null){ finishRecover(v); return; }
  if (arr){ G.res[v.carry.res]+=v.carry.amt; log("📦 Recovered "+v.carry.amt+" "+v.carry.res+"."); v.carry=null; finishRecover(v); }
}
function finishRecover(v){
  if (v.suspended){ const s=v.suspended; v.suspended=null; if (s.phase) s.phase="go"; v.task=s; v.work=0; }
  else v.task=null;
}

// ---------- combat resolution ----------
function killVillager(v){ removeVillager(v); log("☠️ A villager was slain by raiders!"); }
// a villager strikes back when attacked — only a little, returns true if attacker dies
function villagerFightsBack(villager, attacker){
  if (Math.random() < 0.4){                  // weak retaliation vs tougher foes
    attacker.hp -= 1;
    if (attacker.hp<=0){ dropLoot(attacker); removeEnt(attacker.id); log("🛡️ A villager fought off a raider!"); return true; }
  }
  return false;
}
function destroyBuilding(b){
  if (b.type==="warehouse"){ removeEnt(b.id); G.over=true; log("💀 The warehouse has been destroyed!"); flash("Your warehouse is destroyed — game over."); return; }
  if (b.type==="house"){
    if (b.homeOf){ const o=G.ents.find(e=>e.id===b.homeOf); if(o) o.homeId=null; }
    removeEnt(b.id); log("🏚️ Raiders razed a house!");
  } else if (b.type==="watchtower"){
    if (b.crew){ const c=G.ents.find(e=>e.id===b.crew); if(c){ c.task=null; c.stationed=false; } }
    removeEnt(b.id); log("🗼 A watchtower was torn down!");
  }
}
function dropLoot(m){
  if (!m.loot) return;
  addEnt({ type:"item", res:m.loot.res, amt:m.loot.amt, q:m.q, r:m.r });
  log("💰 The slain raider dropped "+m.loot.amt+" "+m.loot.res+" — recover it!");
  m.loot = null;
}
function grabFromWarehouse(){
  const opts = ["food","wood","stone","gold","milk","leather"].filter(k=>G.res[k]>=2);
  if (!opts.length) return null;
  const res = pick(opts), amt = Math.min(Math.floor(G.res[res]), 3+rnd(3));
  G.res[res] -= amt;
  return { res, amt };
}
function nearestEntOfType(from, type, within){
  let best=null, bd=within??1e9;
  for (const e of G.ents){ if (e.type!==type) continue; const d=hexDist(e,from); if (d<=bd){ bd=d; best=e; } }
  return best;
}
function nearestOuterBuilding(from){
  let best=null, bd=1e9;
  for (const e of G.ents){
    if (e.type!=="house" && e.type!=="watchtower") continue;
    const d=hexDist(e,from); if (d<bd){ bd=d; best=e; }
  }
  return best;
}
function nearestCarrier(from){
  let best=null, bd=1e9;
  for (const e of G.ents){ if (e.type!=="villager" || !e.carry) continue; const d=hexDist(e,from); if (d<bd){ bd=d; best=e; } }
  return best;
}
// attackers: thieves are fast and hunt laden villagers; raiders raze inward to the warehouse
function marauderAct(e){
  // if the village is walled/bridged off and nothing can be reached, give up
  if ((e.stuck||0) > 45){ removeEnt(e.id); log("🚪 Raiders found no way in and turned back."); return; }
  const move = (goal, adj, spd) => {            // step, tracking unreachable targets
    const r = stepToward(e, goal, adj, spd);
    e.stuck = (r===null) ? (e.stuck||0)+1 : 0;
    return r;
  };
  const spd = 1;                           // speed comes from baseSpeed (thieves are faster)
  // carrying loot -> flee back the way they came, off the map
  if (e.loot){
    const goal = e.spawn || {q:e.q,r:e.r};
    const arr = move(goal, false, spd);
    if (arr===true || hexDist(e,{q:0,r:0})>=RADIUS){
      log("🏴‍☠️ Raiders escaped with "+e.loot.amt+" "+e.loot.res+"!");
      flash("Raiders made off with your "+e.loot.res+"!");
      removeEnt(e.id);
    }
    return;
  }
  if (e.thief){
    // 1) chase down a villager who is carrying a load and snatch it
    const carrier = nearestCarrier(e);
    if (carrier){
      if (hexDist(e,carrier)<=1){
        e.loot = { res:carrier.carry.res, amt:carrier.carry.amt };
        carrier.carry = null;
        log("🏴‍☠️ A thief waylaid a villager and stole their load!");
        flash("A thief robbed one of your villagers!");
        if (villagerFightsBack(carrier, e)) return;   // villager may drive the thief off
      } else move({q:carrier.q,r:carrier.r}, true, spd);
      return;
    }
    // 2) else snatch a dropped load lying in the open
    const item = nearestEntOfType(e, "item");
    if (item){
      const arr = move({q:item.q,r:item.r}, false, spd);
      if (arr===true){ e.loot={res:item.res, amt:item.amt}; removeEnt(item.id); log("🏴‍☠️ A thief snatched a dropped load!"); }
      return;
    }
    // 3) else grab goods from the warehouse and flee
    const wh = warehouse();
    if (wh){
      if (hexDist(e,wh)<=1){ const loot=grabFromWarehouse(); if (loot){ e.loot=loot; log("🏴‍☠️ A thief grabbed "+loot.amt+" "+loot.res+" from the warehouse!"); } }
      else move({q:wh.q,r:wh.r}, true, spd);
    }
    return;
  }
  // raiders: nearby villager, else nearest outlying building, else the warehouse
  const tgt = nearestEntOfType(e, "villager", 3) || nearestOuterBuilding(e) || warehouse();
  if (!tgt) return;
  if (hexDist(e,tgt)<=1){
    e.acd = (e.acd||0) - 1;
    if (e.acd>0) return;
    e.acd = 2;
    if (tgt.type==="villager"){
      if (villagerFightsBack(tgt, e)) return;         // they trade blows
      tgt.hp = (tgt.hp||1) - 1;
      if (tgt.hp<=0) killVillager(tgt);
    } else {
      tgt.hp = (tgt.hp||1) - 1;
      if (tgt.hp<=0) destroyBuilding(tgt);
    }
  } else {
    move({q:tgt.q,r:tgt.r}, true, spd);
  }
}

// flood: water widens by one tile in every direction, drowning what it touches
function floodTiles(){
  const toFlood = [];
  for (const t of G.map.values()){
    if (t.wet) continue;
    if (DIRS.some(([dq,dr])=>{ const n=G.map.get(key(t.q+dq,t.r+dr)); return n && n.wet; })) toFlood.push(t);
  }
  for (const t of toFlood){ t.elev = Math.min(t.elev, -1); t.improve = null; }
  computeWater();
  let swept = 0;
  for (const e of [...G.ents]){
    const t = G.map.get(key(e.q,e.r));
    if (!t || !t.wet) continue;                       // only things now underwater
    if (e.type==="villager"){ removeVillager(e); swept++; }
    else if (e.type==="house"||e.type==="watchtower"||e.type==="warehouse"){ destroyBuilding(e); swept++; }
    else if (e.type==="cow"||e.type==="marauder"||e.type==="trader"||e.type==="item"){ removeEnt(e.id); swept++; }
  }
  log("🌊 The flood widened the waters"+(swept?" and swept away "+swept+" things!":"."));
  flash("🌊 Flood! The waters spread.");
}

// ---------- watchtower placement & crewing ----------
const TOWER_COST = { wood:6, stone:4, tools:2 };       // tools come only from traders
function tryPlaceTower(h){
  const t = G.map.get(key(h.q,h.r));
  const occupied = G.ents.some(e=>e.q===h.q&&e.r===h.r);
  if (!t || !isWalkable(t) || t.improve || occupied){ flash("Pick an empty, walkable tile."); return; }
  if (!can(TOWER_COST)){ flash("Need 6🪵 4🪨 2🛠️ (trade for tools)."); G.placing=null; return; }
  pay(TOWER_COST);
  const tw = addEnt({ type:"watchtower", q:h.q, r:h.r, built:false, crew:null, cd:0, range:3, hp:6, maxhp:6 });
  G.placing=null;
  assignNearest("buildtower", tw);
  log("🏗️ A watchtower is being raised here.");
}
function assignTower(tw){
  if (!tw.built){ if(assignTask("buildtower",tw)) flash("A builder is on the way."); return; }
  if (tw.crew && G.ents.some(e=>e.id===tw.crew)){ flash("This tower is already manned."); return; }
  if (assignTask("man",tw)) flash("A villager will man the tower.");
}

// instant jobs act in place once the villager arrives
function handleInstant(v){
  const tk = v.task;
  let tq=tk.q, tr=tk.r;
  if (tk.targetId){
    const te = G.ents.find(e=>e.id===tk.targetId);
    if (!te){ v.task=null; return; }
    tq=te.q; tr=te.r;
  }
  const tile = G.map.get(key(tq,tr));
  const adj = (tk.kind==="raise"||tk.kind==="lower"||tk.kind==="bridge"||tk.kind==="unbridge") ? true : !isWalkable(tile);
  const arr = stepToward(v, {q:tq,r:tr}, adj, 1);
  if (arr===null){ v.task=null; flash("A villager can't reach that."); return; }
  if (!arr) return;
  v.work++;
  doWork(v, tk, tq, tr);
}

function doWork(v, tk, tq, tr){
  const tile = G.map.get(key(tq,tr));
  switch (tk.kind){
    case "raise":
      if (v.work>=3){
        if (tile.elev<E_MAX) tile.elev++;
        if (tile.elev > -2) tile.isSea = false;            // raised out of the sea -> reclaimed land
        if (tile.improve && tile.improve.kind==="quarry" && tile.elev>-2) tile.improve=null;
        computeWater(); v.task=null;
        log("⛰️ Land raised — now "+tileName(tile)+".");
      }
      break;
    case "lower":
      if (v.work>=3){
        if (tile.elev>E_MIN) tile.elev--;
        computeWater();
        if (quarry(tile) && !tile.improve) tile.improve={kind:"quarry", stone:4+rnd(4)};
        v.task=null;
        log("🌊 Land lowered — now "+tileName(tile)+".");
      }
      break;
    case "build":
      if (v.work>=4){
        addEnt({type:"house", q:tq, r:tr, homeOf:null, hp:4, maxhp:4});
        v.task=null;
        log("🏠 A new house is built — room for another villager.");
        flash("New house built!");
      }
      break;
    case "bridge":
      if (v.work>=4){ tile.bridge=true; v.task=null; log("🌉 A bridge now spans the water."); flash("Bridge built!"); }
      break;
    case "unbridge":
      if (v.work>=2){ tile.bridge=false; v.task=null; log("🌉 The bridge was dismantled."); }
      break;
    case "trade": {
      const tr2 = G.ents.find(e=>e.id===tk.targetId);
      if (!tr2){ v.task=null; break; }
      if (v.work>=2){
        const sellMilk = Math.floor(G.res.milk);
        const sellLeather = Math.floor(G.res.leather);
        const sellFood = Math.max(0, Math.floor(G.res.food)-4);
        const gold = Math.floor(sellMilk*1.5 + sellLeather*3 + sellFood*1);
        if (gold>0){
          G.res.milk -= sellMilk; G.res.leather -= sellLeather; G.res.food -= sellFood; G.res.gold += gold;
          log("🪙 Sold goods to traders for "+gold+" gold.");
        }
        // buy trade-only goods (e.g. tools) — the only way to obtain them
        let bought=0;
        if (tr2.stock){
          const price=3;
          while (tr2.stock.amt>0 && G.res.gold>=price){ G.res[tr2.stock.res]=(G.res[tr2.stock.res]||0)+1; G.res.gold-=price; tr2.stock.amt--; bought++; }
          if (bought) log("🛠️ Bought "+bought+" "+tr2.stock.res+" from the trader.");
        }
        flash(gold>0||bought ? "Traded: +"+gold+"🪙"+(bought?", +"+bought+" "+tr2.stock.res:"") : "Nothing to trade.");
        v.task=null;
      }
      break;
    }
    case "battle": {
      const m = G.ents.find(e=>e.id===tk.targetId);
      if (!m){ v.task=null; break; }
      if (v.work % 2 === 0){
        m.hp--;
        if (m.hp<=0){
          dropLoot(m); removeEnt(m.id); v.task=null;
          const reward = 2 + rnd(3); G.res.gold += reward;
          log("🛡️ Marauder defeated! Looted "+reward+" gold.");
          flash("Marauder defeated! +"+reward+" gold");
        }
      }
      break;
    }
  }
}

const logEl = document.getElementById("log");
function log(msg){
  const d = document.createElement("div");
  d.textContent = "Day "+G.day+": "+msg;
  logEl.appendChild(d);
  while (logEl.children.length>30) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
const toastEl = document.getElementById("toast");

function flash(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"), 2200);
}

const eventEl=document.getElementById("event"), eTitle=document.getElementById("etitle"),
      eText=document.getElementById("etext"), eOpts=document.getElementById("eopts"), eBox=document.getElementById("ebox");
let typeTimer=null, curEvent=null;
function openEvent(ev){
  curEvent=ev; G.paused=true;
  eTitle.textContent=ev.title; eText.innerHTML=""; eOpts.innerHTML="";
  eventEl.classList.remove("hidden");
  let i=0; clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    i++;
    eText.innerHTML = escapeHtml(ev.text.slice(0,i)) + (i<ev.text.length?"<span class='caret'>▌</span>":"");
    if(i>=ev.text.length){ clearInterval(typeTimer); showOptions(ev); }
  }, 16);
}
function finishTyping(){
  if(!curEvent) return;
  clearInterval(typeTimer);
  eText.textContent=curEvent.text;
  showOptions(curEvent);
}
function showOptions(ev){
  if(eOpts.children.length) return;
  ev.options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="eopt"; b.textContent="› "+opt.label;
    b.onclick=()=>{ opt.fn(); closeEvent(); renderStats(); refreshPanel(); };
    eOpts.appendChild(b);
  });
}
function closeEvent(){ eventEl.classList.add("hidden"); G.paused=false; curEvent=null; }
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
eBox.addEventListener("pointerdown",e=>{ e.stopPropagation(); if(curEvent && eOpts.children.length===0) finishTyping(); });

// ---------- bottom panel / context actions ----------
const selEl = document.getElementById("sel");
const actEl = document.getElementById("actions");
function refreshPanel(){
  const acts = [];
  if (G.over){
    selEl.innerHTML = "<b>Your village has fallen.</b>";
    acts.push({label:"↻ New village", cls:"go", fn:newGame});
    renderActions(acts); return;
  }
  if (G.placing==="watchtower"){
    selEl.innerHTML = "<b>Siting a watchtower</b> — tap an empty, walkable tile (costs 6🪵 4🪨).";
    acts.push({label:"✖ Cancel", cls:"down", fn:()=>{ G.placing=null; flash("Cancelled."); refreshPanel(); }});
    renderActions(acts); return;
  }
  const h = G.selHex;
  if (!h){
    selEl.innerHTML = "Tap a forest, quarry, cow or marauder to set a villager to work. Tap a <b>home</b> to find its villager.";
    renderActions([]); return;
  }
  const t = G.map.get(key(h.q,h.r));
  if (!t){ G.selHex=null; renderActions([]); return; }
  const ent = G.ents.find(e=>e.q===h.q&&e.r===h.r);

  if (ent && ent.type==="warehouse"){
    const trade = villageConnected();
    selEl.innerHTML = "<b>🏛️ Warehouse (HQ)</b>"+(ent.hp<ent.maxhp?` · ❤️ ${ent.hp}/${ent.maxhp}`:"")+"<br>"
      + `🌾 ${Math.floor(G.res.food)} · 🥛 ${Math.floor(G.res.milk)} · 🪵 ${Math.floor(G.res.wood)} · 🪨 ${Math.floor(G.res.stone)} · 🟫 ${Math.floor(G.res.leather)} · 🛠️ ${Math.floor(G.res.tools)} · 🪙 ${Math.floor(G.res.gold)} · 🧑 ${G.pop}/${houseCount()}`
      + "<br><span style='font-size:11px'>"+(trade?"🛣️ Trade routes open.":"⛔ Cut off — no traders can reach you.")+" "+(G.alarm?"Alarm raised.":"Hold to ring the alarm.")+"</span>";
    acts.push({label: G.alarm?"✅ All clear":"🔔 Sound alarm", cls: G.alarm?"go":"down", fn:()=>toggleAlarm()});
    acts.push({label:"🗺️ New map", fn:()=>{ if(confirm("Abandon this village and start a fresh map?")) newGame(); }});
    renderActions(acts); return;
  }
  if (ent && ent.type==="item"){
    selEl.innerHTML = `<b>📦 Dropped ${ent.amt} ${ent.res}</b> — send a villager to carry it home.`;
    acts.push({label:"📦 Recover load", cls:"go", fn:()=>{ if(assignTask("recover",ent)) flash("Fetching the dropped load."); }});
    renderActions(acts); return;
  }
  if (ent && ent.type==="house"){
    const owner = ent.homeOf && G.ents.find(e=>e.id===ent.homeOf);
    selEl.innerHTML = owner
      ? `<b>🏠 Home</b> of a villager — <span style="color:#ffe066">highlighted</span> · ${villagerStatus(owner)}`
      : "<b>🏠 Home</b> — empty, waiting for a villager.";
    if (owner) acts.push({label:"📍 Select villager", cls:"go", fn:()=>{ G.selHex={q:owner.q,r:owner.r}; refreshPanel(); }});
    renderActions(acts); return;
  }
  if (ent && ent.type==="watchtower"){
    selEl.innerHTML = ent.built
      ? `<b>🗼 Watchtower</b> — ${ent.crew?"manned, firing on raiders":"unmanned"} · range ${ent.range}`
      : "<b>🗼 Watchtower</b> — under construction…";
    if (!ent.built) acts.push({label:"🏗️ Send builder", fn:()=>assignTower(ent)});
    else if (!ent.crew) acts.push({label:"🏹 Man the tower", cls:"go", fn:()=>assignTower(ent)});
    else acts.push({label:"✋ Stand down", cls:"down", fn:()=>{ const c=G.ents.find(e=>e.id===ent.crew); if(c){c.task=null;c.stationed=false;} ent.crew=null; flash("The tower is unmanned."); refreshPanel(); }});
    renderActions(acts); return;
  }

  let desc = `<b>${tileName(t)}</b> · elev ${t.elev>0?"+":""}${t.elev}`;
  desc += isWalkable(t) ? " · "+speedWord(t) : " · impassable";
  if (t.improve) desc += t.improve.kind==="forest" ? " · 🌲 forest"
                       : t.improve.kind==="quarry" ? " · 🪨 quarry"
                       : " · 🌾 farm";
  if (ent) desc += " · "+entLabel(ent.type);
  if (ent && ent.type==="villager") desc += " — "+villagerStatus(ent);
  selEl.innerHTML = desc;

  if (ent && ent.type==="villager" && ent.task)
    acts.push({label:"✋ Recall", cls:"down", fn:()=>{ ent.task=null; ent.carry=null; ent.stationed=false; flash("Villager recalled — now idle."); refreshPanel(); }});
  if (ent && ent.type==="cow") acts.push({label:"🐄 Tend (milk/hide)", cls:"go", fn:()=>cmd("tend",ent)});
  if (ent && ent.type==="trader") acts.push({label:"🛒 Trade", cls:"go", fn:()=>cmd("trade",ent)});
  if (ent && ent.type==="marauder") acts.push({label:"⚔️ Battle", cls:"go", fn:()=>cmd("battle",ent)});

  if (!ent || ent.type==="villager"){
    acts.push({label:"▲ Raise", cls:"up", dis:t.elev>=E_MAX, fn:()=>terraform(h.q,h.r,1)});
    acts.push({label:"▼ Lower", cls:"down", dis:t.elev<=E_MIN, fn:()=>terraform(h.q,h.r,-1)});
  }
  if (t.improve && t.improve.kind==="forest" && !ent)
    acts.push({label:"🪵 Cut wood (forester)", fn:()=>assignTask("chop",{q:h.q,r:h.r})});
  if (t.improve && t.improve.kind==="quarry")
    acts.push({label:"⛏️ Mine stone", fn:()=>assignTask("mine",{q:h.q,r:h.r})});
  if (t.elev===0 && !t.improve && !t.wet && !ent)
    acts.push({label:"🌾 Farm (food)", fn:()=>assignTask("farm",{q:h.q,r:h.r})});
  if (t.improve && t.improve.kind==="farm" && !ent)
    acts.push({label:"🌾 Harvest (food)", fn:()=>assignTask("farm",{q:h.q,r:h.r})});
  if (t.elev>=0 && t.elev<=2 && !t.improve && !t.wet && !ent)
    acts.push({label:"🏠 Build house (3🪵 2🪨)", fn:()=>{
      if (!can({wood:3,stone:2})){flash("Need 3 wood, 2 stone.");return;}
      pay({wood:3,stone:2}); assignTask("build",{q:h.q,r:h.r});
    }});
  // bridges over a narrow river / strait
  if (t.bridge && !ent)
    acts.push({label:"🌉 Remove bridge", cls:"down", fn:()=>assignTask("unbridge",{q:h.q,r:h.r})});
  else if (bridgeable(t) && !ent)
    acts.push({label:"🌉 Build bridge (3🪵)", fn:()=>{
      if (!can({wood:3})){flash("Need 3 wood.");return;}
      pay({wood:3}); assignTask("bridge",{q:h.q,r:h.r});
    }});
  renderActions(acts);
}
function entLabel(t){
  return { warehouse:"🏛️ warehouse", house:"🏠 home", villager:"🧑 villager", cow:"🐄 cows", trader:"🛒 traders", marauder:"⚔️ marauder", watchtower:"🗼 watchtower", item:"📦 dropped load" }[t]||t;
}
function villagerStatus(v){
  if (!v.task) return "idle";
  if (v.task.kind==="muster") return "mustering at the alarm";
  if (v.task.kind==="recover") return v.carry ? "carrying a dropped load home" : "fetching a dropped load";
  if (v.task.kind==="man") return v.stationed ? "manning the watchtower" : "heading to the tower";
  if (v.task.kind==="buildtower") return "building the watchtower";
  const g = GATHER[v.task.kind];
  if (g){
    if (v.carry || v.task.phase==="home") return "hauling "+g.res+" home";
    if (v.task.phase==="work") return g.verb;
    return "walking to "+g.verb.replace(/ing$/,"")+" site";
  }
  return ({raise:"raising land",lower:"lowering land",build:"building a house",trade:"trading",battle:"fighting"})[v.task.kind]||"working";
}
function renderActions(acts){
  actEl.innerHTML="";
  for (const a of acts){
    const b=document.createElement("button");
    b.className="act"+(a.cls?" "+a.cls:"");
    b.textContent=a.label; b.disabled=!!a.dis;
    b.onclick=(e)=>{ e.stopPropagation(); a.fn(); };
    actEl.appendChild(b);
  }
}
function cmd(kind, ent){ if (assignTask(kind, ent)) flash("Villager dispatched."); }

// ---------- input: tap vs swipe ----------
const cv = document.getElementById("cv");
let cam = {x:0,y:0};
let down = null;
function evToHex(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const px = clientX - rect.left - cam.x;
  const py = clientY - rect.top - cam.y;
  const h = pixelToHex(px, py);
  return G.map.has(key(h.q,h.r)) ? h : null;
}
let holdT = null;
function clearHold(){ if (holdT){ clearTimeout(holdT); holdT=null; } }
function onDown(x,y){
  down = { x, y, hex: evToHex(x,y), held:false };
  clearHold();
  const onWh = down.hex && G.ents.some(e=>e.type==="warehouse"&&e.q===down.hex.q&&e.r===down.hex.r);
  if (onWh) holdT = setTimeout(()=>{ if(down){ down.held=true; toggleAlarm(); } }, 550);  // hold to ring / silence bell
}
function onMove(x,y){ if (down && Math.hypot(x-down.x, y-down.y) > 12) clearHold(); }
function onUp(x,y){
  clearHold();
  if (!down) return;
  if (down.held){ down=null; return; }            // long-press already handled (alarm)
  const dx = x-down.x, dy = y-down.y;
  const dist = Math.hypot(dx,dy);
  const h = down.hex; down = null;
  if (!h){ G.selHex=null; refreshPanel(); return; }
  if (dist < 14){ handleTap(h); }
  else if (Math.abs(dy) > 22 && Math.abs(dy) > Math.abs(dx)*1.1){
    G.selHex = h; terraform(h.q, h.r, dy<0 ? 1 : -1); refreshPanel();
  } else { G.selHex = h; refreshPanel(); }
}
function handleTap(h){
  if (G.placing==="watchtower"){ tryPlaceTower(h); refreshPanel(); return; }
  G.selHex = h;
  const ent = G.ents.find(e=>e.q===h.q&&e.r===h.r);
  const t = G.map.get(key(h.q,h.r));
  // tapping something of interest puts the nearest idle villager to work on it
  if (ent && ent.type==="cow") assignNearest("tend", ent);
  else if (ent && ent.type==="trader") assignNearest("trade", ent);
  else if (ent && ent.type==="marauder") assignNearest("battle", ent);
  else if (ent && ent.type==="watchtower") assignTower(ent);
  else if (ent && ent.type==="item"){ if(assignTask("recover",ent)) flash("Fetching the dropped load."); }
  else if (!ent && t.improve && t.improve.kind==="forest") assignNearest("chop", h);
  else if (!ent && t.improve && t.improve.kind==="quarry") assignNearest("mine", h);
  else if (!ent && t.improve && t.improve.kind==="farm") assignNearest("farm", h);
  refreshPanel();
}
cv.addEventListener("pointerdown",e=>onDown(e.clientX,e.clientY));
cv.addEventListener("pointermove",e=>onMove(e.clientX,e.clientY));
cv.addEventListener("pointerup",e=>onUp(e.clientX,e.clientY));
cv.addEventListener("pointercancel",()=>{ clearHold(); down=null; });
cv.addEventListener("contextmenu",e=>e.preventDefault());

// ---------- colour helpers ----------
function mix(c, amt){ // amt>0 lighten toward white, <0 darken toward black
  if (amt>=0) return [c[0]+(255-c[0])*amt, c[1]+(255-c[1])*amt, c[2]+(255-c[2])*amt];
  const k=1+amt; return [c[0]*k, c[1]*k, c[2]*k];
}
const rgb = c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

// precompute hex corner unit vectors + per-edge lighting (light from upper-left)
const CORNER = [];
for (let i=0;i<6;i++){ const a=Math.PI/180*(60*i+30); CORNER.push([Math.cos(a),Math.sin(a)]); }
const LIGHT = (()=>{ const v=[-0.45,-1]; const m=Math.hypot(v[0],v[1]); return [v[0]/m,v[1]/m]; })();
const EDGE = [];
for (let i=0;i<6;i++){
  const a=CORNER[i], b=CORNER[(i+1)%6];
  let nx=(a[0]+b[0])/2, ny=(a[1]+b[1])/2; const m=Math.hypot(nx,ny)||1; nx/=m; ny/=m;
  const lit = (nx*LIGHT[0]+ny*LIGHT[1]);          // -1 (shadow) .. 1 (lit)
  EDGE.push({ down: ny>0.1, lit });
}

// ---------- rendering ----------
const ctx = cv.getContext("2d");
let DPR = 1;
function resize(){
  const stage = document.getElementById("stage");
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w = stage.clientWidth, hgt = stage.clientHeight;
  cv.width = w*DPR; cv.height = hgt*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const t of G.map.values()){
    const p = hexToPixel(t.q,t.r);
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }
  const gw=(maxX-minX)+HEX*2, gh=(maxY-minY)+HEX*2+ELEV*E_MAX+HEX;
  const scale = Math.min(w/gw, hgt/gh, 1.3);
  HEX = HEX*scale;
  minX=1e9;maxX=-1e9;minY=1e9;maxY=-1e9;
  for (const t of G.map.values()){
    const p = hexToPixel(t.q,t.r);
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }
  cam.x = w/2 - (minX+maxX)/2;
  cam.y = hgt/2 - (minY+maxY)/2 + ELEV*E_MAX/2;  // bias so tall hills aren't clipped at top
}

function corners(cx,cy){
  const p=[];
  for (let i=0;i<6;i++) p.push([cx+HEX*CORNER[i][0], cy+HEX*CORNER[i][1]]);
  return p;
}
function poly(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
}

function tileTop(t){
  if (deepWater(t))    return mix(W_DEEP, -0.04);
  if (shallowWater(t)) return mix(W_SHALL, 0.04);
  if (quarry(t))       return mix(ROCK, -0.12);
  if (mountain(t))     return mix(MOUNT, 0.10);
  return mix(GRASS, t.elev*0.07);                 // hills brighter, dips darker — lighting, not colour
}

let lastTs = 0;
function draw(ts){
  const now = (ts!=null) ? ts : (globalThis.performance ? performance.now() : Date.now());
  let dt = (now - lastTs) / 1000; lastTs = now;
  if (!(dt>0)) dt = 0; if (dt>0.1) dt = 0.1;     // clamp big gaps (tab switch)
  if (!G.paused && !G.over) moveEntities(dt);     // real-time, continuous movement

  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "#0e131b"; ctx.fillRect(0,0,cv.width,cv.height);

  const tiles = [...G.map.values()].sort((a,b)=> (a.r-b.r) || (a.q-b.q));
  for (const t of tiles){
    const p = hexToPixel(t.q,t.r);
    const cx = p.x+cam.x, baseY = p.y+cam.y;
    const lift = t.elev>0 ? t.elev*ELEV : 0;       // only hills/mountains rise; dips stay flat (shaded)
    const topY = baseY - lift;
    const top = corners(cx, topY);
    const top0 = tileTop(t);

    // raised: shaded side walls (the "mass" of hills) — strong highlight/shadow identity
    if (lift>0){
      const sideBase = mix(top0, -0.30);
      const base = corners(cx, baseY);
      for (let i=0;i<6;i++){
        if (!EDGE[i].down) continue;               // draw only front-facing walls
        const sh = -0.18 + 0.18*EDGE[i].lit;       // directional shade
        ctx.fillStyle = rgb(mix(sideBase, sh));
        poly([top[i], top[(i+1)%6], base[(i+1)%6], base[i]]); ctx.fill();
      }
    }

    // top face
    poly(top); ctx.fillStyle = rgb(top0); ctx.fill();

    // recessed look for dips / quarries / deep water: inner shadow ring
    if (t.elev<0){
      ctx.save(); poly(top); ctx.clip();
      ctx.lineWidth = HEX*0.42; poly(top);
      ctx.strokeStyle = `rgba(0,0,0,${t.elev<=-2?0.34:0.20})`; ctx.stroke();
      ctx.restore();
    } else if (lift>0){
      // crisp lit rim on the upper edges of raised tiles
      for (let i=0;i<6;i++){
        if (EDGE[i].down) continue;
        ctx.beginPath(); ctx.moveTo(top[i][0],top[i][1]); ctx.lineTo(top[(i+1)%6][0],top[(i+1)%6][1]);
        ctx.strokeStyle="rgba(255,255,255,0.18)"; ctx.lineWidth=1.5; ctx.stroke();
      }
    }

    poly(top); ctx.lineWidth=1; ctx.strokeStyle="rgba(150,160,172,0.45)"; ctx.stroke();  // 1px grey tile outline

    if (t.improve){
      if (t.improve.kind==="forest") drawTrees(cx, topY);
      else if (t.improve.kind==="farm") drawFarm(cx, topY);
      else if (t.improve.kind==="quarry") drawQuarry(cx, topY);
    }
    if (t.bridge) drawBridge(cx, baseY);
    if (G.selHex && G.selHex.q===t.q && G.selHex.r===t.r){
      poly(top); ctx.lineWidth=3; ctx.strokeStyle="#ffe066"; ctx.stroke();
    }
  }

  drawPaths();
  drawShots();

  // villager whose home is currently selected gets a highlight ring
  let hi = null;
  if (G.selHex){
    const selEnt = G.ents.find(e=>e.q===G.selHex.q&&e.r===G.selHex.r&&e.type==="house");
    if (selEnt && selEnt.homeOf) hi = selEnt.homeOf;
  }

  const ents = [...G.ents].sort((a,b)=> (a.y-b.y) || (a.x-b.x));
  for (const e of ents){
    const lift = liftOf(e.q,e.r);
    const cx = e.x*HEX+cam.x, cy = e.y*HEX+cam.y - lift - HEX*0.18;
    if (e.id===hi){
      ctx.beginPath(); ctx.arc(cx, cy, HEX*0.6, 0, 7);
      ctx.strokeStyle="#ffe066"; ctx.lineWidth=2.5; ctx.stroke();
    }
    drawEntity(e, cx, cy);
    // health bar for damaged things and all marauders
    if (e.maxhp && (e.hp<e.maxhp || e.type==="marauder")){
      const top = e.type==="watchtower" ? cy-HEX*0.95 : e.type==="warehouse" ? cy-HEX*1.0 : cy-HEX*0.55;
      drawHpBar(cx, top, Math.max(0,e.hp)/e.maxhp, e.type==="marauder"?"#e3604f":"#6ab150");
    }
  }
  requestAnimationFrame(draw);
}
function drawHpBar(cx, cy, frac, col){
  const w=HEX*0.7, hh=3;
  ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(cx-w/2-1, cy-1, w+2, hh+2);
  ctx.fillStyle=col; ctx.fillRect(cx-w/2, cy, w*frac, hh);
}
const RESCOL = { wood:"#8a5a32", gold:"#f2c94c", milk:"#eaf2fb", food:"#6ab150", stone:"#b9b2a6", leather:"#9c6b3f" };

// fading watchtower arrows
function drawShots(){
  ctx.save(); ctx.lineWidth=2;
  for (let i=G.shots.length-1;i>=0;i--){
    const sh=G.shots[i]; const a=hexToPixel(sh.a.q,sh.a.r), b=hexToPixel(sh.b.q,sh.b.r);
    ctx.strokeStyle=`rgba(255,230,150,${Math.max(0,sh.life/8)})`;
    ctx.beginPath();
    ctx.moveTo(a.x+cam.x, a.y+cam.y - liftOf(sh.a.q,sh.a.r) - HEX*0.6);
    ctx.lineTo(b.x+cam.x, b.y+cam.y - liftOf(sh.b.q,sh.b.r) - HEX*0.18);
    ctx.stroke();
    if (--sh.life<=0) G.shots.splice(i,1);
  }
  ctx.restore();
}

function liftOf(q,r){ const t=G.map.get(key(q,r)); return t && t.elev>0 ? t.elev*ELEV : 0; }

// faint dotted path lines along planned routes
function drawPaths(){
  ctx.save(); ctx.setLineDash([3,5]); ctx.lineWidth=1.5;
  for (const e of G.ents){
    if (!e.path || !e.path.length) continue;
    if (e.type!=="villager" && e.type!=="marauder") continue;
    ctx.strokeStyle = e.type==="marauder" ? "rgba(227,96,79,0.40)" : "rgba(235,242,251,0.30)";
    ctx.beginPath();
    ctx.moveTo(e.x*HEX+cam.x, e.y*HEX+cam.y - liftOf(e.q,e.r) - HEX*0.1);
    for (const c of e.path){
      const p = uPix(c.q,c.r);
      ctx.lineTo(p.x*HEX+cam.x, p.y*HEX+cam.y - liftOf(c.q,c.r) - HEX*0.1);
    }
    ctx.stroke();
  }
  ctx.restore(); ctx.setLineDash([]);
}

function drawEntity(e,cx,cy){
  const s = HEX*0.42;
  switch(e.type){
    case "item": {
      const col = RESCOL[e.res]||"#fff";
      ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(cx, cy+s*0.28, s*0.4, s*0.16, 0,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.strokeStyle="#1a232e"; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(cx, cy, s*0.34, 0, 7); ctx.fill(); ctx.stroke();
      break;
    }
    case "watchtower": {
      const built = e.built;
      ctx.fillStyle = built ? "#8b8f98" : "#6c7077"; ctx.strokeStyle="#2c2f34"; ctx.lineWidth=1.5;
      ctx.fillRect(cx-s*0.5, cy-s*1.25, s*1.0, s*1.6); ctx.strokeRect(cx-s*0.5, cy-s*1.25, s*1.0, s*1.6);
      if (built){
        ctx.fillStyle="#9aa0a8";                            // crenellations
        for (let i=0;i<3;i++) ctx.fillRect(cx-s*0.5+i*s*0.39, cy-s*1.5, s*0.27, s*0.3);
        if (e.crew){ ctx.fillStyle="#f4f7fb"; ctx.beginPath(); ctx.arc(cx, cy-s*1.45, s*0.17, 0, 7); ctx.fill(); }
      } else {
        ctx.strokeStyle="#caa64a"; ctx.lineWidth=1.5;       // scaffolding
        ctx.beginPath(); ctx.moveTo(cx-s*0.5,cy+s*0.35); ctx.lineTo(cx+s*0.5,cy-s*1.25);
        ctx.moveTo(cx+s*0.5,cy+s*0.35); ctx.lineTo(cx-s*0.5,cy-s*1.25); ctx.stroke();
      }
      break;
    }
    case "warehouse": {
      // stone HQ with a tall spire and a bell on top
      ctx.fillStyle="#837b6f"; ctx.strokeStyle="#34302a"; ctx.lineWidth=1.5;
      ctx.fillRect(cx-s*0.85, cy-s*0.55, s*1.7, s*1.15); ctx.strokeRect(cx-s*0.85, cy-s*0.55, s*1.7, s*1.15);
      ctx.fillStyle="#b1b8c0";                            // door
      ctx.fillRect(cx-s*0.22, cy-s*0.02, s*0.44, s*0.62);
      ctx.fillStyle="#9c5b3a"; ctx.strokeStyle="#5c3320"; // spire
      ctx.beginPath(); ctx.moveTo(cx-s*0.55, cy-s*0.55); ctx.lineTo(cx, cy-s*1.95); ctx.lineTo(cx+s*0.55, cy-s*0.55); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle="#f2c94c"; ctx.beginPath(); ctx.arc(cx, cy-s*1.9, s*0.18, 0, 7); ctx.fill();   // bell
      ctx.strokeStyle="#7a5e18"; ctx.stroke();
      break;
    }
    case "house":
      ctx.fillStyle="#8a5a32"; ctx.strokeStyle="#3a2412"; ctx.lineWidth=1.5;
      ctx.fillRect(cx-s*0.7, cy-s*0.55, s*1.4, s*1.1); ctx.strokeRect(cx-s*0.7, cy-s*0.55, s*1.4, s*1.1);
      ctx.fillStyle="#b5713f"; ctx.beginPath();
      ctx.moveTo(cx-s*0.85,cy-s*0.55); ctx.lineTo(cx,cy-s*1.15); ctx.lineTo(cx+s*0.85,cy-s*0.55); ctx.closePath(); ctx.fill();
      break;
    case "villager":
      ctx.fillStyle="#f4f7fb"; ctx.strokeStyle="#243140"; ctx.lineWidth=1.2;
      ctx.fillRect(cx-s*0.35,cy-s*0.35,s*0.7,s*0.7); ctx.strokeRect(cx-s*0.35,cy-s*0.35,s*0.7,s*0.7);
      if (e.carry){                                       // a little load being carried home
        ctx.fillStyle=RESCOL[e.carry.res]||"#fff"; ctx.beginPath(); ctx.arc(cx, cy-s*0.62, s*0.22, 0, 7); ctx.fill();
        ctx.strokeStyle="#243140"; ctx.lineWidth=1; ctx.stroke();
      }
      break;
    case "cow":
      ctx.fillStyle="#f0f0f0"; ctx.beginPath(); ctx.ellipse(cx,cy,s*0.55,s*0.4,0,0,7); ctx.fill();
      ctx.fillStyle="#2a2a2a"; ctx.beginPath(); ctx.arc(cx-s*0.2,cy,s*0.15,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+s*0.18,cy+s*0.08,s*0.12,0,7); ctx.fill();
      break;
    case "trader":
      ctx.fillStyle="#b07ad6"; ctx.beginPath(); ctx.arc(cx,cy,s*0.45,0,7); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font=`${s*0.7}px sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("$",cx,cy+1);
      break;
    case "marauder":
      ctx.fillStyle = e.thief ? "#c77fd6" : "#e3604f";    // thieves are purple, raiders red
      ctx.strokeStyle = e.thief ? "#5a2a66" : "#5c1f17"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(cx,cy-s*0.5); ctx.lineTo(cx+s*0.5,cy+s*0.4); ctx.lineTo(cx-s*0.5,cy+s*0.4); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle="#fff"; ctx.font=`${s*0.5}px sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(e.hp, cx, cy+s*0.12);
      if (e.loot){                                        // stolen goods being carried off
        ctx.fillStyle=RESCOL[e.loot.res]||"#fff"; ctx.beginPath(); ctx.arc(cx+s*0.4, cy-s*0.4, s*0.2, 0, 7); ctx.fill();
        ctx.strokeStyle="#1a232e"; ctx.lineWidth=1; ctx.stroke();
      }
      break;
  }
}
function drawTrees(cx,cy){
  const s=HEX*0.3;
  for (const off of [[-0.3,0.1],[0.3,0.15],[0,-0.2]]){
    const x=cx+off[0]*HEX, y=cy+off[1]*HEX;
    ctx.fillStyle="#235c2a"; ctx.beginPath();
    ctx.moveTo(x,y-s*0.9); ctx.lineTo(x+s*0.5,y+s*0.4); ctx.lineTo(x-s*0.5,y+s*0.4); ctx.closePath(); ctx.fill();
  }
}
function drawFarm(cx,cy){
  ctx.strokeStyle="#caa64a"; ctx.lineWidth=2;
  for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(cx-HEX*0.5, cy+i*HEX*0.22); ctx.lineTo(cx+HEX*0.5, cy+i*HEX*0.22); ctx.stroke(); }
}
function drawQuarry(cx,cy){
  ctx.fillStyle="#b9b2a6";
  for (const off of [[-0.18,0.05],[0.2,-0.05],[0.02,0.2]]){
    ctx.beginPath(); ctx.arc(cx+off[0]*HEX, cy+off[1]*HEX, HEX*0.12, 0, 7); ctx.fill();
  }
}
function drawBridge(cx,cy){
  const w=HEX*1.12, hh=HEX*0.42;
  ctx.fillStyle="#7a5230"; ctx.strokeStyle="#3f2a14"; ctx.lineWidth=1.2;
  ctx.fillRect(cx-w/2, cy-hh/2, w, hh); ctx.strokeRect(cx-w/2, cy-hh/2, w, hh);
  ctx.strokeStyle="#5c3d1e"; ctx.lineWidth=1;
  for (let i=1;i<5;i++){ const x=cx-w/2+i*w/5; ctx.beginPath(); ctx.moveTo(x,cy-hh/2); ctx.lineTo(x,cy+hh/2); ctx.stroke(); }
}

// ---------- save / resume (localStorage) ----------
const SAVE_KEY = "hexvillage.save.v1";
function saveGame(){
  try{
    const tiles=[];
    for (const t of G.map.values()) tiles.push({q:t.q,r:t.r,elev:t.elev,improve:t.improve,isSea:t.isSea,wet:t.wet,bridge:t.bridge});
    const ents = G.ents.map(e=>{ const c={...e}; delete c.path; delete c.goal; delete c.pathCells; delete c.ax; delete c.ay; return c; });
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      ver:1, res:G.res, pop:G.pop, day:G.day, tick:G.tick,
      nextEvent:G.nextEvent, lastBadTick:G.lastBadTick, alarm:G.alarm, over:G.over, nextId, tiles, ents
    }));
  } catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d = JSON.parse(raw); if(!d || d.ver!==1 || !Array.isArray(d.tiles) || !d.tiles.length) return false;
    G.map.clear();
    for (const t of d.tiles) G.map.set(key(t.q,t.r),
      { q:t.q, r:t.r, elev:t.elev, improve:t.improve||null, isSea:!!t.isSea, wet:!!t.wet, bridge:!!t.bridge });
    G.ents = (d.ents||[]).map(e=>{ const c={...e}; if(c.x===undefined){ const p=uPix(c.q,c.r); c.x=p.x; c.y=p.y; } return c; });
    G.res = Object.assign({...START_RES}, d.res||{});
    G.pop=d.pop|0; G.day=d.day|0; G.tick=d.tick|0;
    G.nextEvent=d.nextEvent|0; G.lastBadTick=d.lastBadTick??-999;
    G.alarm=!!d.alarm; G.over=!!d.over; G.placing=null; G.paused=false; G.shots=[]; G.selHex=null;
    nextId = d.nextId||1;
    computeWater();
    return true;
  } catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function newGame(){ clearSave(); restart(); }

// ---------- boot ----------
function restart(){
  G.res={...START_RES}; G.pop=0;
  G.day=0; G.tick=0; G.selHex=null; G.placing=null; G.paused=false; G.alarm=false; G.shots=[];
  G.nextEvent=60; G.lastBadTick=-999; G.over=false;
  closeEvent();
  logEl.innerHTML="";
  setupStart(); resize(); renderStats(); refreshPanel(); saveGame();
}

if (!loadGame()) setupStart();
resize();
renderStats(); refreshPanel();
window.addEventListener("resize", ()=>{ HEX=26; resize(); });
window.addEventListener("beforeunload", saveGame);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveGame(); });
draw();
setInterval(logicTick, 700);
</script>
